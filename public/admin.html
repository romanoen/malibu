<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Buchungsverwaltung</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/admin-manifest.webmanifest">
    <meta name="theme-color" content="#2f6b5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Malibu Admin">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --admin-bg: #efede6;
            --admin-page: #f7f5ef;
            --admin-surface: #fcfbf8;
            --admin-surface-strong: #ffffff;
            --admin-line: #ddd8cd;
            --admin-text: #182320;
            --admin-muted: #68716c;
            --admin-accent: #2f6b5f;
            --admin-accent-strong: #214d44;
            --admin-accent-soft: #dce8e3;
            --admin-warning: #8a6331;
            --admin-warning-soft: #f2e8d8;
            --admin-info: #395f79;
            --admin-info-soft: #dce8f0;
            --admin-danger: #934d45;
            --admin-danger-soft: #f4e3e0;
            --admin-success: #2c695a;
            --admin-success-soft: #dcebe5;
            --admin-shadow: 0 24px 60px rgba(21, 30, 27, 0.10);
            --admin-shadow-soft: 0 10px 24px rgba(21, 30, 27, 0.08);
            --admin-radius-xl: 28px;
            --admin-radius-lg: 20px;
            --admin-radius-md: 14px;
            --admin-radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            font-family: "Helvetica Neue", "Avenir Next", "Segoe UI Variable", "Segoe UI", sans-serif;
            color: var(--admin-text);
            background: linear-gradient(180deg, var(--admin-page) 0%, var(--admin-bg) 100%);
        }

        .admin-container,
        .login-container {
            border: 1px solid rgba(24, 35, 32, 0.06);
            box-shadow: var(--admin-shadow);
        }

        .admin-container {
            max-width: 1320px;
            margin: 0 auto;
            background: var(--admin-surface);
            border-radius: var(--admin-radius-xl);
            padding: 28px;
        }

        .login-container {
            max-width: 440px;
            margin: 86px auto;
            background: var(--admin-surface-strong);
            border-radius: var(--admin-radius-xl);
            padding: 40px;
        }

        .login-kicker,
        .section-kicker {
            margin: 0 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--admin-muted);
        }

        .login-container h1,
        .topbar h1 {
            margin: 0;
            color: var(--admin-text);
        }

        .login-container h1 {
            font-size: 2.6rem;
            line-height: 1;
            letter-spacing: 0;
        }

        .topbar h1 {
            font-size: 2.05rem;
            line-height: 1.1;
            letter-spacing: 0;
            font-weight: 720;
        }

        .login-copy,
        .topbar-copy {
            margin: 14px 0 0;
            color: var(--admin-muted);
            line-height: 1.55;
            max-width: 34rem;
        }

        .topbar .section-kicker {
            margin-bottom: 6px;
            color: var(--admin-accent);
            letter-spacing: 0.08em;
        }

        .topbar-copy {
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .login-form input,
        .notes-section textarea {
            border: 1px solid var(--admin-line);
            border-radius: var(--admin-radius-md);
            background: rgba(255, 255, 255, 0.92);
            color: var(--admin-text);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-form input {
            width: 100%;
            padding: 15px 16px;
            margin: 26px 0 18px;
            font-size: 16px;
        }

        .login-form input:focus,
        .notes-section textarea:focus {
            outline: none;
            border-color: rgba(47, 107, 95, 0.65);
            box-shadow: 0 0 0 4px rgba(47, 107, 95, 0.12);
        }

        .topbar {
            margin-bottom: 26px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
            align-items: flex-end;
            padding: 0 0 14px;
            color: var(--admin-text);
            background: transparent;
            border-bottom: 1px solid rgba(24, 35, 32, 0.10);
        }

        .topbar-intro {
            flex: 1;
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
        }

        .topbar .btn-secondary {
            align-self: flex-end;
        }

        .topbar-actions {
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
        }

        .download-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1em;
            font-size: 1.05em;
            line-height: 1;
        }

        .topbar-menu {
            position: relative;
        }

        .menu-toggle {
            width: 46px;
            min-height: 42px;
            padding: 10px;
            border-radius: 999px;
            font-size: 1.25rem;
            line-height: 1;
        }

        .admin-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: min(280px, calc(100vw - 48px));
            display: grid;
            gap: 6px;
            padding: 8px;
            border: 1px solid rgba(24, 35, 32, 0.10);
            border-radius: var(--admin-radius-md);
            background: var(--admin-surface-strong);
            box-shadow: var(--admin-shadow-soft);
            z-index: 20;
        }

        .menu-item {
            width: 100%;
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border: 0;
            border-radius: var(--admin-radius-sm);
            background: transparent;
            color: var(--admin-text);
            cursor: pointer;
            font: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            text-align: left;
        }

        .menu-item:hover {
            background: rgba(24, 35, 32, 0.06);
        }

        .menu-item.push-active {
            background: var(--admin-success-soft);
            color: var(--admin-success);
        }

        .menu-item:disabled {
            color: #9aa39f;
            cursor: not-allowed;
            background: transparent;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        @media (min-width: 980px) {
            .dashboard {
                grid-template-columns: minmax(260px, 0.34fr) minmax(0, 1fr);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.88);
            color: var(--admin-text);
            padding: 24px;
            border-radius: var(--admin-radius-lg);
            box-shadow: var(--admin-shadow-soft);
            border: 1px solid rgba(24, 35, 32, 0.06);
        }

        .stat-card h3 {
            margin: 0;
            font-size: 0.86rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--admin-muted);
        }

        .stat-card .value {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            margin: 16px 0 10px;
        }

        .stat-subline,
        .period-label {
            color: var(--admin-muted);
            font-size: 0.95rem;
            line-height: 1.45;
            min-height: 1.45em;
        }

        .stat-bookings {
            margin-top: 8px;
        }

        .stat-bookings strong {
            color: var(--admin-text);
            font-weight: 850;
        }

        .chart-card {
            min-height: 330px;
            min-width: 0;
        }

        .revenue-chart {
            margin-top: 16px;
            min-height: 248px;
            width: 100%;
        }

        .revenue-chart svg {
            display: block;
            width: 100%;
            height: 220px;
            overflow: visible;
        }

        .chart-axis,
        .chart-grid {
            stroke: rgba(24, 35, 32, 0.14);
            stroke-width: 1;
        }

        .chart-grid {
            stroke-dasharray: 3 6;
        }

        .chart-line {
            fill: none;
            stroke: var(--admin-accent);
            stroke-width: 4.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chart-area {
            fill: rgba(47, 107, 95, 0.10);
        }

        .chart-point {
            fill: var(--admin-surface-strong);
            stroke: var(--admin-accent);
            stroke-width: 4;
        }

        .chart-months {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 2px;
            margin-top: 8px;
            color: var(--admin-muted);
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
        }

        .chart-months span {
            min-width: 0;
            overflow: hidden;
            text-overflow: clip;
        }

        .chart-empty {
            min-height: 248px;
            display: grid;
            place-items: center;
            border-radius: var(--admin-radius-md);
            background: rgba(24, 35, 32, 0.04);
            color: var(--admin-muted);
            font-weight: 700;
            text-align: center;
        }

        .period-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .period-btn,
        .btn {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }

        .period-btn {
            padding: 10px 16px;
            background: rgba(24, 35, 32, 0.06);
            border-color: rgba(24, 35, 32, 0.05);
            color: var(--admin-text);
            font-size: 0.86rem;
        }

        .period-btn.active {
            background: var(--admin-accent);
            color: white;
            box-shadow: 0 10px 20px rgba(47, 107, 95, 0.18);
        }

        .btn {
            padding: 10px 16px;
            font-size: 0.88rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover,
        .period-btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary,
        .btn-verify {
            background: var(--admin-accent);
            color: white;
            box-shadow: 0 12px 22px rgba(47, 107, 95, 0.18);
        }

        .btn-primary:hover,
        .btn-verify:hover {
            background: var(--admin-accent-strong);
        }

        .btn-secondary {
            background: rgba(24, 35, 32, 0.06);
            color: var(--admin-text);
            border-color: rgba(24, 35, 32, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(24, 35, 32, 0.10);
        }

        .btn.push-active {
            background: var(--admin-success-soft);
            color: var(--admin-success);
            border-color: rgba(44, 105, 90, 0.20);
        }

        .btn-delete {
            background: transparent;
            color: var(--admin-danger);
            border-color: rgba(147, 77, 69, 0.22);
        }

        .btn-delete:hover {
            background: var(--admin-danger-soft);
        }

        .btn:disabled,
        .btn-verify:disabled {
            background: #a7b4af;
            color: white;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            border-color: transparent;
        }

        .feedback-banner {
            padding: 14px 18px;
            border-radius: var(--admin-radius-md);
            margin-bottom: 22px;
            font-weight: 600;
            line-height: 1.45;
            border: 1px solid transparent;
        }

        .feedback-success {
            background: var(--admin-success-soft);
            color: var(--admin-success);
            border-color: rgba(44, 105, 90, 0.18);
        }

        .feedback-error {
            background: var(--admin-danger-soft);
            color: var(--admin-danger);
            border-color: rgba(147, 77, 69, 0.18);
        }

        .feedback-info {
            background: var(--admin-info-soft);
            color: var(--admin-info);
            border-color: rgba(57, 95, 121, 0.18);
        }

        .day-group {
            margin-bottom: 18px;
        }

        .day-header {
            width: 100%;
            background: #e7ddd0;
            padding: 18px 20px;
            border-radius: var(--admin-radius-lg);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(112, 95, 74, 0.18);
            box-shadow: none;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            text-align: left;
        }

        .day-header:hover {
            transform: translateY(-1px);
            border-color: rgba(112, 95, 74, 0.28);
            background: #e2d6c7;
        }

        .day-header.today {
            background: #d9e5da;
            border-color: rgba(47, 107, 95, 0.22);
        }

        .day-header h3 {
            margin: 0;
            color: var(--admin-text);
            font-size: 1.05rem;
        }

        .day-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .day-header .count,
        .day-header .pending-badge,
        .day-header .day-revenue,
        .day-toggle {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 7px 12px;
        }

        .day-header .count {
            background: rgba(255, 255, 255, 0.72);
            color: var(--admin-text);
        }

        .day-header .pending-badge {
            background: var(--admin-warning-soft);
            color: var(--admin-warning);
        }

        .day-header .day-revenue {
            background: rgba(255, 255, 255, 0.72);
            color: var(--admin-text);
        }

        .day-toggle {
            background: rgba(255, 255, 255, 0.58);
            color: var(--admin-muted);
        }

        .day-bookings {
            display: none;
            padding: 4px 0 0;
        }

        .day-bookings.expanded {
            display: grid;
            gap: 12px;
            padding: 4px 6px 0;
        }

        .booking-card {
            background: #fffdf9;
            border-radius: var(--admin-radius-lg);
            padding: 22px;
            box-shadow: 0 8px 18px rgba(21, 30, 27, 0.05);
            border: 1px solid rgba(24, 35, 32, 0.06);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .booking-main {
            flex: 1 1 380px;
            min-width: 0;
        }

        .booking-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .booking-main h3 {
            margin: 0;
            color: var(--admin-text);
            font-size: 1.18rem;
        }

        .booking-schedule {
            margin: 0 0 14px;
            font-size: 1.42rem;
            line-height: 1;
            letter-spacing: -0.04em;
            font-weight: 700;
            color: var(--admin-accent-strong);
        }

        .booking-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(24, 35, 32, 0.06);
            color: var(--admin-text);
            font-size: 0.88rem;
            line-height: 1.25;
            font-weight: 600;
            white-space: normal;
        }

        .meta-pill-verified {
            background: var(--admin-success-soft);
            color: var(--admin-success);
        }

        .booking-phone {
            margin: 0;
            color: var(--admin-muted);
            font-size: 0.95rem;
        }

        .booking-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }

        .status-badge {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
        }

        .status-pending {
            background: var(--admin-warning-soft);
            color: var(--admin-warning);
        }

        .status-payment_pending {
            background: var(--admin-info-soft);
            color: var(--admin-info);
        }

        .status-confirmed {
            background: var(--admin-success-soft);
            color: var(--admin-success);
        }

        .notes-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(24, 35, 32, 0.08);
        }

        .notes-label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--admin-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .notes-section textarea {
            width: 100%;
            min-height: 92px;
            padding: 14px 15px;
            font-size: 0.9rem;
            resize: vertical;
        }

        .notes-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .notes-display {
            background: rgba(24, 35, 32, 0.05);
            padding: 12px 14px;
            border-radius: var(--admin-radius-md);
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--admin-text);
        }

        .hidden {
            display: none !important;
        }

        .error-message {
            background: var(--admin-danger-soft);
            color: var(--admin-danger);
            padding: 15px;
            border-radius: var(--admin-radius-md);
            margin-bottom: 20px;
            border: 1px solid rgba(147, 77, 69, 0.18);
        }

        .empty-state {
            padding: 28px;
            border-radius: var(--admin-radius-lg);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: var(--admin-shadow-soft);
            color: var(--admin-muted);
            line-height: 1.55;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 6px;
            color: var(--admin-text);
            font-size: 1rem;
        }

        .new-booking-notification {
            position: fixed;
            top: 22px;
            right: 22px;
            background: rgba(24, 35, 32, 0.92);
            color: white;
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            cursor: pointer;
            max-width: 280px;
            line-height: 1.4;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 720px) {
            body {
                padding: 16px;
            }

            .login-container,
            .admin-container {
                padding: 22px;
            }

            .login-container h1 {
                font-size: 2.1rem;
            }

            .topbar h1 {
                font-size: 1.75rem;
            }

            .topbar,
            .booking-header,
            .booking-topline {
                flex-direction: column;
                align-items: stretch;
            }

            .booking-actions,
            .day-meta {
                justify-content: flex-start;
            }

            .btn,
            .period-btn {
                width: 100%;
                justify-content: center;
            }

            .menu-toggle {
                width: 46px;
            }

            .topbar-actions {
                align-self: flex-end;
            }

            .new-booking-notification {
                left: 16px;
                right: 16px;
                top: auto;
                bottom: 16px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <p class="login-kicker">Malibu SUP</p>
        <h1>Admin</h1>
        <p class="login-copy">Buchungen, Zahlungen und Notizen in einem ruhigen, klaren Board verwalten.</p>
        <form class="login-form" id="loginForm">
            <label for="passwordInput" class="sr-only">Passwort</label>
            <input type="password" id="passwordInput" placeholder="Passwort" required>
            <button type="submit" class="btn btn-primary">Anmelden</button>
        </form>
        <div id="loginError" class="error-message hidden"></div>
    </div>

        <div id="adminDashboard" class="admin-container hidden">
            <div class="topbar" role="banner">
                <div class="topbar-intro">
                    <p class="section-kicker">Malibu SUP</p>
                    <h1>Buchungen verwalten</h1>
                </div>
                <div class="topbar-actions">
                    <div class="topbar-menu">
                        <button type="button" id="adminMenuToggle" class="btn btn-secondary menu-toggle" onclick="toggleAdminMenu(event)" aria-haspopup="true" aria-expanded="false" aria-label="Admin-Menü öffnen">
                            &#8942;
                        </button>
                        <div id="adminMenu" class="admin-menu hidden" role="menu" aria-label="Admin-Menü">
                            <button type="button" id="pushToggleButton" onclick="handlePushButtonClick(this)" class="menu-item" role="menuitem" disabled>
                                Push prüfen...
                            </button>
                            <button type="button" onclick="downloadRevenuePdf()" class="menu-item" role="menuitem">
                                <span class="download-icon" aria-hidden="true">&#8595;</span>
                                Umsatzaufstellung herunterladen
                            </button>
                            <button type="button" onclick="downloadDatabaseExport()" class="menu-item" role="menuitem">
                                <span class="download-icon" aria-hidden="true">&#8595;</span>
                                Datenbank exportieren
                            </button>
                            <button type="button" onclick="logout()" class="menu-item" role="menuitem">
                                Abmelden
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        <div id="adminFeedback" class="feedback-banner hidden"></div>

        <div class="dashboard">
            <div class="stat-card">
                <h3>Umsatz</h3>
                <div class="value" id="totalRevenue">0,00 EUR</div>
                <div id="unconfirmedRevenue" class="stat-subline"></div>
                <div class="stat-subline stat-bookings">
                    <strong id="totalBookings">0</strong> Buchungen · <span id="periodLabel">Dieser Monat</span>
                </div>
                <div class="period-selector">
                    <button class="period-btn" onclick="loadStatistics('week', true)">Woche</button>
                    <button class="period-btn active" onclick="loadStatistics('month', true)">Monat</button>
                    <button class="period-btn" onclick="loadStatistics('year', true)">Jahr</button>
                </div>
            </div>
            <div class="stat-card chart-card">
                <h3>Umsatzentwicklung</h3>
                <div id="revenueChart" class="revenue-chart" aria-label="Kumulierte Umsatzentwicklung der letzten 12 Monate als Liniendiagramm"></div>
            </div>
        </div>

        <div id="bookingsList"></div>
    </div>

    <script>
        let isAuthenticated = false;
        let authStateVersion = 0;
        let currentPeriod = localStorage.getItem('adminPeriod') || 'month';
        let latestBookings = [];
        let expandedDays = readStoredJsonArray('adminExpandedDays');
        let lastBookingCount = 0;
        let lastBookingId = null;
        let isPolling = false;
        let hasLoadedOnce = false;
        let feedbackTimeoutId = null;
        let pushRegistration = null;
        let pushPublicKeyPromise = null;
        const PUSH_PUBLIC_KEY_STORAGE_KEY = 'malibuPushPublicKey';

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function toJsString(value) {
            return JSON.stringify(String(value ?? ''))
                .replace(/</g, '\\u003c')
                .replace(/\u2028/g, '\\u2028')
                .replace(/\u2029/g, '\\u2029');
        }

        function getDayElementId(dateKey) {
            const safeDateKey = String(dateKey)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .toLowerCase();

            return `day-${safeDateKey}`;
        }

        function formatCurrency(amount) {
            return Number.parseFloat(amount || 0).toLocaleString('de-DE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' EUR';
        }

        function readStoredJsonArray(key) {
            try {
                const parsedValue = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsedValue) ? parsedValue : [];
            } catch (error) {
                return [];
            }
        }

        function parseBookingDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function getBookingDateKey(value) {
            const date = parseBookingDate(value);
            if (!date) {
                return 'Ohne Datum';
            }

            return date.toLocaleDateString('de-DE', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function getBookingDateSortValue(value) {
            const date = parseBookingDate(value);
            if (!date) {
                return Number.NEGATIVE_INFINITY;
            }

            return new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
        }

        function formatBookingTime(value) {
            const date = parseBookingDate(value);
            if (!date) {
                return 'Keine Zeit';
            }

            return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function toPositiveInteger(value, fallback = 1) {
            const parsedValue = Number.parseInt(value, 10);
            return Number.isFinite(parsedValue) && parsedValue > 0 ? parsedValue : fallback;
        }

        function addDays(date, days) {
            const nextDate = new Date(date);
            nextDate.setDate(nextDate.getDate() + days);
            return nextDate;
        }

        function addMonths(date, months) {
            return new Date(date.getFullYear(), date.getMonth() + months, 1);
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function getDayStart(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function getCumulativeDailyRevenueSeries(bookings = latestBookings) {
            const now = new Date();
            const rangeStart = new Date(now.getFullYear(), now.getMonth() - 11, 1);
            const rangeEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
            const dayMs = 24 * 60 * 60 * 1000;
            const dayCount = Math.max(1, Math.floor((getDayStart(rangeEnd) - rangeStart) / dayMs) + 1);
            const dailyValues = Array.from({ length: dayCount }, (_, index) => ({
                date: addDays(rangeStart, index),
                dailyRevenue: 0,
                cumulativeRevenue: 0
            }));

            bookings.forEach(booking => {
                const bookingDate = parseBookingDate(booking.startTime) || parseBookingDate(booking.createdAt);
                if (!bookingDate || bookingDate < rangeStart || bookingDate > rangeEnd) {
                    return;
                }

                const dayIndex = Math.floor((getDayStart(bookingDate) - rangeStart) / dayMs);
                if (dayIndex >= 0 && dayIndex < dailyValues.length) {
                    dailyValues[dayIndex].dailyRevenue += Number.parseFloat(booking.price || 0);
                }
            });

            let cumulativeRevenue = 0;
            dailyValues.forEach(item => {
                cumulativeRevenue += item.dailyRevenue;
                item.cumulativeRevenue = cumulativeRevenue;
            });

            const months = Array.from({ length: 12 }, (_, index) => {
                const date = addMonths(rangeStart, index);
                return {
                    date,
                    label: date.toLocaleDateString('de-DE', { month: 'short' })
                };
            });

            return {
                rangeStart,
                rangeEnd,
                days: dailyValues,
                months,
                totalRevenue: cumulativeRevenue
            };
        }

        function getRevenueChartXForDate(date, firstDate, lastDate, minX, maxX) {
            const range = Math.max(lastDate - firstDate, 1);
            return minX + (clamp((date - firstDate) / range, 0, 1) * (maxX - minX));
        }

        function renderRevenueChart(bookings = latestBookings) {
            const chart = document.getElementById('revenueChart');
            if (!chart) {
                return;
            }

            const series = getCumulativeDailyRevenueSeries(bookings);

            if (series.totalRevenue <= 0) {
                chart.innerHTML = '<div class="chart-empty">Keine Umsätze in den letzten 12 Monaten</div>';
                return;
            }

            const maxValue = Math.max(...series.days.map(item => item.cumulativeRevenue), 1);
            const minX = 28;
            const maxX = 700;
            const minY = 18;
            const maxY = 188;
            const firstDate = series.days[0].date;
            const lastDate = series.days[series.days.length - 1].date;
            const points = series.days.map(item => {
                const x = getRevenueChartXForDate(item.date, firstDate, lastDate, minX, maxX);
                const y = maxY - ((item.cumulativeRevenue / maxValue) * (maxY - minY));
                return { ...item, x, y };
            });
            const linePoints = points.map(point => `${point.x.toFixed(2)},${point.y.toFixed(2)}`).join(' ');
            const areaPoints = [
                `${points[0].x.toFixed(2)},${maxY}`,
                linePoints,
                `${points[points.length - 1].x.toFixed(2)},${maxY}`
            ].join(' ');
            const visiblePoints = points.filter((_, index) => (
                index === 0 ||
                index === points.length - 1 ||
                points[index].dailyRevenue > 0
            ));
            const monthTicks = series.months.map(month => ({
                ...month,
                x: getRevenueChartXForDate(month.date, firstDate, lastDate, minX, maxX)
            }));

            chart.innerHTML = `
                <svg viewBox="0 0 720 205" preserveAspectRatio="none" role="img" aria-label="Kumulierte Umsatzentwicklung der letzten 12 Monate">
                    <line class="chart-grid" x1="${minX}" y1="${minY}" x2="${maxX}" y2="${minY}"></line>
                    <line class="chart-grid" x1="${minX}" y1="${((minY + maxY) / 2).toFixed(2)}" x2="${maxX}" y2="${((minY + maxY) / 2).toFixed(2)}"></line>
                    <line class="chart-axis" x1="${minX}" y1="${maxY}" x2="${maxX}" y2="${maxY}"></line>
                    ${monthTicks.map(tick => `
                        <line class="chart-grid" x1="${tick.x.toFixed(2)}" y1="${minY}" x2="${tick.x.toFixed(2)}" y2="${maxY}"></line>
                    `).join('')}
                    <polygon class="chart-area" points="${areaPoints}"></polygon>
                    <polyline class="chart-line" points="${linePoints}"></polyline>
                    ${visiblePoints.map(point => `
                        <circle class="chart-point" cx="${point.x.toFixed(2)}" cy="${point.y.toFixed(2)}" r="4.2">
                            <title>${escapeHtml(point.date.toLocaleDateString('de-DE'))}: ${escapeHtml(formatCurrency(point.cumulativeRevenue))}</title>
                        </circle>
                    `).join('')}
                </svg>
                <div class="chart-months" aria-hidden="true">
                    ${monthTicks.map(tick => `<span>${escapeHtml(tick.label)}</span>`).join('')}
                </div>
            `;
        }

        function closeAdminMenu() {
            const menu = document.getElementById('adminMenu');
            const toggle = document.getElementById('adminMenuToggle');
            menu?.classList.add('hidden');
            toggle?.setAttribute('aria-expanded', 'false');
        }

        function toggleAdminMenu(event) {
            event?.stopPropagation();
            const menu = document.getElementById('adminMenu');
            const toggle = document.getElementById('adminMenuToggle');
            const isOpen = !menu.classList.contains('hidden');
            menu.classList.toggle('hidden', isOpen);
            toggle.setAttribute('aria-expanded', String(!isOpen));
        }

        async function readJson(response) {
            try {
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        function clearAdminFeedback() {
            const feedback = document.getElementById('adminFeedback');
            feedback.className = 'feedback-banner hidden';
            feedback.textContent = '';

            if (feedbackTimeoutId) {
                clearTimeout(feedbackTimeoutId);
                feedbackTimeoutId = null;
            }
        }

        function showAdminFeedback(message, tone = 'success') {
            const feedback = document.getElementById('adminFeedback');
            feedback.textContent = message;
            feedback.className = `feedback-banner feedback-${tone}`;

            if (feedbackTimeoutId) {
                clearTimeout(feedbackTimeoutId);
            }

            feedbackTimeoutId = setTimeout(() => {
                clearAdminFeedback();
            }, 4000);
        }

        async function adminFetch(url, options = {}) {
            const { handleUnauthorized = true, ...fetchOptions } = options;
            const response = await fetch(url, {
                credentials: 'same-origin',
                ...fetchOptions,
                headers: {
                    ...(fetchOptions.headers || {})
                }
            });

            if (handleUnauthorized && response.status === 401) {
                showLoggedOutState();
            }

            return response;
        }

        function supportsPushNotifications() {
            return 'serviceWorker' in navigator &&
                'PushManager' in window &&
                'Notification' in window;
        }

        function isIosDevice() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function isStandaloneWebApp() {
            return window.navigator.standalone === true ||
                window.matchMedia('(display-mode: standalone)').matches;
        }

        function getPushUnavailableReason() {
            if (supportsPushNotifications()) {
                return null;
            }

            if (isIosDevice() && !isStandaloneWebApp()) {
                return 'ios-browser';
            }

            if (isIosDevice()) {
                return 'ios-unsupported';
            }

            return 'unsupported';
        }

        function showPushUnavailableFeedback(reason) {
            if (reason === 'ios-browser') {
                showAdminFeedback('Auf dem iPhone geht Push erst als Home-Bildschirm-App: In Safari teilen, "Zum Home-Bildschirm" wählen, dann Malibu Admin vom Home-Bildschirm öffnen.', 'info');
                return;
            }

            if (reason === 'ios-unsupported') {
                showAdminFeedback('Auf dem iPhone braucht Web Push iOS 16.4 oder neuer und die geöffnete Home-Bildschirm-App.', 'error');
                return;
            }

            showAdminFeedback('Push-Benachrichtigungen werden von diesem Browser nicht unterstützt.', 'error');
        }

        function setPushButtonState(label, options = {}) {
            const button = document.getElementById('pushToggleButton');
            if (!button) return;

            button.textContent = label;
            button.disabled = Boolean(options.disabled);
            button.dataset.pushMode = options.mode || 'enable';
            button.classList.toggle('push-active', Boolean(options.active));
        }

        async function handlePushButtonClick(button) {
            closeAdminMenu();
            if (button?.dataset.pushMode === 'test') {
                await sendTestPushNotification(button);
                return;
            }

            await enablePushNotifications();
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);

            for (let index = 0; index < rawData.length; index += 1) {
                outputArray[index] = rawData.charCodeAt(index);
            }

            return outputArray;
        }

        function arrayBufferToBase64Url(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';

            bytes.forEach(byte => {
                binary += String.fromCharCode(byte);
            });

            return window.btoa(binary)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/g, '');
        }

        function subscriptionMatchesPublicKey(subscription, publicKey) {
            const applicationServerKey = subscription?.options?.applicationServerKey;
            if (!applicationServerKey) {
                return true;
            }

            return arrayBufferToBase64Url(applicationServerKey) === publicKey;
        }

        async function getPushPublicKey() {
            if (!pushPublicKeyPromise) {
                pushPublicKeyPromise = adminFetch('/api/admin/push-public-key')
                    .then(async response => {
                        const data = await readJson(response);
                        if (!response.ok || !data?.publicKey) {
                            throw new Error(data?.error || 'Push-Key konnte nicht geladen werden');
                        }

                        return data.publicKey;
                    });
            }

            return pushPublicKeyPromise;
        }

        async function registerAdminServiceWorker() {
            if (pushRegistration) {
                return pushRegistration;
            }

            pushRegistration = await navigator.serviceWorker.register('/admin-sw.js');
            await pushRegistration.update().catch(() => {});
            await navigator.serviceWorker.ready;
            return pushRegistration;
        }

        async function savePushSubscription(subscription) {
            const response = await adminFetch('/api/admin/push-subscriptions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    subscription: typeof subscription.toJSON === 'function'
                        ? subscription.toJSON()
                        : subscription
                })
            });
            const data = await readJson(response);

            if (!response.ok || data?.success !== true) {
                throw new Error(data?.error || 'Push konnte nicht aktiviert werden');
            }
        }

        async function deleteStoredPushSubscription(endpoint) {
            await adminFetch('/api/admin/push-subscriptions', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ endpoint })
            });
        }

        async function resetPushSubscription() {
            const registration = await registerAdminServiceWorker();
            const subscription = await registration.pushManager.getSubscription();

            if (subscription) {
                const endpoint = subscription.endpoint;
                await subscription.unsubscribe();
                await deleteStoredPushSubscription(endpoint).catch(() => {});
            }

            localStorage.removeItem(PUSH_PUBLIC_KEY_STORAGE_KEY);
        }

        async function getCurrentPushSubscription(registration, publicKey) {
            let subscription = await registration.pushManager.getSubscription();
            const storedPublicKey = localStorage.getItem(PUSH_PUBLIC_KEY_STORAGE_KEY);
            const hasMissingStoredKey = subscription && !storedPublicKey;
            const hasStoredKeyMismatch = storedPublicKey && storedPublicKey !== publicKey;

            if (subscription && (hasMissingStoredKey || hasStoredKeyMismatch || !subscriptionMatchesPublicKey(subscription, publicKey))) {
                const endpoint = subscription.endpoint;
                await subscription.unsubscribe();
                await deleteStoredPushSubscription(endpoint).catch(() => {});
                subscription = null;
            }

            return subscription;
        }

        async function initializePushControls() {
            const unavailableReason = getPushUnavailableReason();
            if (unavailableReason === 'ios-browser') {
                setPushButtonState('iPhone einrichten');
                return;
            }

            if (unavailableReason) {
                setPushButtonState('Push nicht verfügbar', { disabled: true });
                return;
            }

            if (Notification.permission === 'denied') {
                setPushButtonState('Push blockiert', { disabled: true });
                return;
            }

            setPushButtonState('Push prüfen...', { disabled: true });

            try {
                const publicKey = await getPushPublicKey();
                const registration = await registerAdminServiceWorker();
                const subscription = await getCurrentPushSubscription(registration, publicKey);

                if (subscription) {
                    await savePushSubscription(subscription);
                    localStorage.setItem(PUSH_PUBLIC_KEY_STORAGE_KEY, publicKey);
                    setPushButtonState('Push testen', { active: true, mode: 'test' });
                    return;
                }

                setPushButtonState('Push aktivieren');
            } catch (error) {
                console.error('Push initialization error:', error);
                setPushButtonState('Push aktivieren');
            }
        }

        async function enablePushNotifications() {
            const unavailableReason = getPushUnavailableReason();
            if (unavailableReason) {
                showPushUnavailableFeedback(unavailableReason);
                return;
            }

            if (Notification.permission === 'denied') {
                setPushButtonState('Push blockiert', { disabled: true });
                showAdminFeedback('Push ist im Browser blockiert. Bitte in den Website-Einstellungen erlauben.', 'error');
                return;
            }

            setPushButtonState('Push aktiviert...', { disabled: true });

            try {
                const publicKey = await getPushPublicKey();
                const registration = await registerAdminServiceWorker();
                let subscription = await getCurrentPushSubscription(registration, publicKey);

                if (!subscription) {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') {
                        setPushButtonState('Push aktivieren');
                        showAdminFeedback('Push-Benachrichtigungen wurden nicht erlaubt.', 'error');
                        return;
                    }

                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicKey)
                    });
                }

                await savePushSubscription(subscription);
                localStorage.setItem(PUSH_PUBLIC_KEY_STORAGE_KEY, publicKey);
                setPushButtonState('Push testen', { active: true, mode: 'test' });
                showAdminFeedback('Push-Benachrichtigungen sind für dieses Gerät aktiv. Du kannst jetzt mit "Push testen" eine Testnachricht senden.', 'success');
            } catch (error) {
                console.error('Push activation error:', error);
                pushPublicKeyPromise = null;
                setPushButtonState('Push aktivieren');
                showAdminFeedback(error.message || 'Push konnte nicht aktiviert werden.', 'error');
            }
        }

        async function sendTestPushNotification(button) {
            const originalText = button?.textContent;

            if (button) {
                button.disabled = true;
                button.textContent = 'Sendet...';
            }

            try {
                const response = await adminFetch('/api/admin/push-test', {
                    method: 'POST'
                });
                const data = await readJson(response);

                if (response.ok && data?.success) {
                    showTestPushSuccess(data);
                    return;
                }

                if (shouldRepairPushSubscription(data)) {
                    await repairPushSubscriptionAndRetryTest(button);
                    return;
                }

                showAdminFeedback(data?.error || 'Test-Push konnte nicht gesendet werden.', 'error');
            } catch (error) {
                console.error('Test push error:', error);
                showAdminFeedback('Test-Push konnte nicht gesendet werden.', 'error');
            } finally {
                if (button && button.isConnected) {
                    button.disabled = false;
                    button.textContent = originalText || 'Push testen';
                    button.dataset.pushMode = 'test';
                }
            }
        }

        function showTestPushSuccess(data) {
            const warning = data?.temporaryKeys
                ? ' Achtung: In Production fehlen feste VAPID-Keys, nach Neustarts bitte Push neu aktivieren.'
                : '';
            showAdminFeedback(`Test-Push wurde an dein iPhone gesendet. Falls kein Banner erscheint, App schließen oder iPhone sperren und erneut testen.${warning}`, data?.temporaryKeys ? 'info' : 'success');
        }

        function shouldRepairPushSubscription(data) {
            return Boolean(data) && (
                Number(data.removed || 0) > 0 ||
                Number(data.failed || 0) > 0 ||
                data.temporaryKeys === true
            );
        }

        async function repairPushSubscriptionAndRetryTest(button) {
            try {
                if (button) {
                    button.textContent = 'Verbindet neu...';
                }

                await resetPushSubscription();
                await enablePushNotifications();

                if (button) {
                    button.disabled = true;
                    button.textContent = 'Testet erneut...';
                }

                const retryResponse = await adminFetch('/api/admin/push-test', {
                    method: 'POST'
                });
                const retryData = await readJson(retryResponse);

                if (retryResponse.ok && retryData?.success) {
                    showTestPushSuccess(retryData);
                    return;
                }

                showAdminFeedback(retryData?.error || 'Push wurde neu verbunden, aber der Test konnte noch nicht zugestellt werden.', 'error');
            } catch (error) {
                console.error('Push repair error:', error);
                showAdminFeedback('Push konnte nicht neu verbunden werden.', 'error');
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data?.type !== 'malibu-push-received') {
                    return;
                }

                const title = event.data.payload?.title || 'Push';
                showAdminFeedback(`${title} wurde vom iPhone empfangen. Wenn kein Banner erscheint, liegt es an iOS Vordergrund/Fokus/Mitteilungs-Einstellungen.`, 'info');
            });
        }

        document.addEventListener('click', event => {
            if (!event.target.closest('.topbar-menu')) {
                closeAdminMenu();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeAdminMenu();
            }
        });

        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            document.getElementById('loginError').classList.add('hidden');
            const loginVersion = ++authStateVersion;

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await readJson(response);

                if (loginVersion !== authStateVersion) {
                    return;
                }

                if (response.ok && data?.success) {
                    isAuthenticated = true;
                    document.getElementById('passwordInput').value = '';
                    showDashboard();
                } else {
                    showLoginError(data?.error || 'Falsches Passwort');
                }
            } catch (error) {
                showLoginError('Fehler beim Login');
            }
        });

        async function checkSession() {
            const requestVersion = authStateVersion;

            try {
                const response = await adminFetch('/api/admin/session', {
                    handleUnauthorized: false
                });

                if (requestVersion !== authStateVersion) {
                    return;
                }

                if (response.ok) {
                    isAuthenticated = true;
                    showDashboard();
                } else {
                    showLoggedOutState();
                }
            } catch (error) {
                showLoggedOutState();
            }
        }

        function showDashboard() {
            isAuthenticated = true;
            clearAdminFeedback();
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');

            restorePeriodSelection();
            loadStatistics(currentPeriod);
            loadBookings();
            startPolling();
            initializePushControls();
        }

        function restorePeriodSelection() {
            document.querySelectorAll('.period-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim() === getPeriodButtonText(currentPeriod)) {
                    btn.classList.add('active');
                }
            });
        }

        function getPeriodButtonText(period) {
            const map = { week: 'Woche', month: 'Monat', year: 'Jahr' };
            return map[period] || 'Monat';
        }

        function showLoggedOutState() {
            authStateVersion += 1;
            isAuthenticated = false;
            lastBookingCount = 0;
            lastBookingId = null;
            hasLoadedOnce = false;
            latestBookings = [];
            renderRevenueChart([]);
            clearAdminFeedback();
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('bookingsList').innerHTML = '';

            const notification = document.getElementById('newBookingNotification');
            if (notification) {
                notification.remove();
            }
        }

        async function logout() {
            closeAdminMenu();
            try {
                await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
            } catch (error) {
                console.error('Logout error:', error);
            } finally {
                showLoggedOutState();
            }
        }

        async function downloadRevenuePdf() {
            closeAdminMenu();
            try {
                const response = await adminFetch('/api/admin/revenue-pdf');
                if (!response.ok) {
                    const data = await readJson(response);
                    throw new Error(data?.error || 'Download fehlgeschlagen');
                }

                await downloadResponseAsFile(response, 'malibu-umsatzaufstellung.pdf');
            } catch (error) {
                showAdminFeedback(error.message || 'Download fehlgeschlagen.', 'error');
            }
        }

        async function downloadDatabaseExport() {
            closeAdminMenu();
            try {
                const response = await adminFetch('/api/admin/database-export');
                if (!response.ok) {
                    const data = await readJson(response);
                    throw new Error(data?.error || 'Export fehlgeschlagen');
                }

                await downloadResponseAsFile(response, 'malibu-datenbank-export.json');
            } catch (error) {
                showAdminFeedback(error.message || 'Export fehlgeschlagen.', 'error');
            }
        }

        async function downloadResponseAsFile(response, fallbackFilename) {
            const blob = await response.blob();
            const downloadUrl = URL.createObjectURL(blob);
            const disposition = response.headers.get('content-disposition') || '';
            const filenameMatch = disposition.match(/filename="([^"]+)"/);
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = filenameMatch?.[1] || fallbackFilename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(downloadUrl);
        }

        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        async function loadStatistics(period, updateUI = true) {
            currentPeriod = period;
            localStorage.setItem('adminPeriod', period);

            if (updateUI) {
                document.querySelectorAll('.period-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.textContent.trim() === getPeriodButtonText(period)) {
                        btn.classList.add('active');
                    }
                });
            }

            try {
                const response = await adminFetch(`/api/admin/statistics?period=${period}`);
                if (!response.ok) {
                    throw new Error();
                }

                const data = await readJson(response);
                const totalRevenue = parseFloat(data?.totalRevenue || 0);
                const unconfirmedRevenue = parseFloat(data?.unconfirmedRevenue || 0);

                document.getElementById('totalRevenue').textContent = formatCurrency(totalRevenue);

                const unconfirmedElement = document.getElementById('unconfirmedRevenue');
                if (unconfirmedRevenue > 0) {
                    unconfirmedElement.textContent = `davon unbestätigt: ${formatCurrency(unconfirmedRevenue)}`;
                    unconfirmedElement.style.display = 'block';
                } else {
                    unconfirmedElement.textContent = '';
                    unconfirmedElement.style.display = 'none';
                }

                document.getElementById('totalBookings').textContent = data?.totalBookings ?? 0;

                const periodLabels = {
                    week: 'Diese Woche',
                    month: 'Dieser Monat',
                    year: 'Dieses Jahr'
                };
                document.getElementById('periodLabel').textContent = periodLabels[period] || 'Gesamt';
                renderRevenueChart(latestBookings);
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        async function loadBookings(forceUpdate = false) {
            try {
                const response = await adminFetch('/api/admin/bookings');
                if (!response.ok) {
                    throw new Error();
                }

                const bookingsData = await readJson(response) || [];
                const bookings = Array.isArray(bookingsData) ? bookingsData : [];
                latestBookings = bookings;
                renderRevenueChart(latestBookings);
                const currentBookingCount = bookings.length;
                const newestBookingId = bookings.length > 0 ? bookings[0].id : null;
                const hasBookingChanges = !hasLoadedOnce ||
                    currentBookingCount !== lastBookingCount ||
                    newestBookingId !== lastBookingId;
                const hasLikelyNewBooking = hasLoadedOnce &&
                    currentBookingCount >= lastBookingCount &&
                    newestBookingId &&
                    newestBookingId !== lastBookingId;

                if (bookings.length === 0) {
                    document.getElementById('bookingsList').innerHTML = `
                        <div class="empty-state">
                            <strong>Keine Buchungen vorhanden.</strong>
                            Neue Reservierungen erscheinen hier automatisch.
                        </div>
                    `;
                    lastBookingCount = 0;
                    lastBookingId = null;
                    hasLoadedOnce = true;
                    return;
                }

                const bookingsByDate = {};
                const dateMap = {};

                bookings.forEach(booking => {
                    const dateKey = getBookingDateKey(booking.startTime);

                    if (!bookingsByDate[dateKey]) {
                        bookingsByDate[dateKey] = [];
                        dateMap[dateKey] = getBookingDateSortValue(booking.startTime);
                    }
                    bookingsByDate[dateKey].push(booking);
                });

                const sortedDates = Object.keys(bookingsByDate).sort((a, b) => dateMap[b] - dateMap[a]);
                const shouldSkipRender = !forceUpdate && !hasBookingChanges;
                if (shouldSkipRender) {
                    return;
                }

                lastBookingCount = currentBookingCount;
                lastBookingId = newestBookingId;
                hasLoadedOnce = true;

                const todayKey = getBookingDateKey(new Date());

                let html = '';
                sortedDates.forEach(dateKey => {
                    const dayBookings = bookingsByDate[dateKey];
                    dayBookings.sort((a, b) => {
                        const leftDate = parseBookingDate(a.startTime);
                        const rightDate = parseBookingDate(b.startTime);
                        return (leftDate?.getTime() || 0) - (rightDate?.getTime() || 0);
                    });
                    const isExpanded = expandedDays.includes(dateKey);
                    const isToday = dateKey === todayKey;
                    const dateKeyJs = toJsString(dateKey);
                    const toggleAction = escapeHtml(`toggleDay(this, ${dateKeyJs})`);
                    const dayId = getDayElementId(dateKey);
                    const pendingCount = dayBookings.filter(b =>
                        b.status === 'pending' || b.status === 'payment_pending'
                    ).length;
                    const countText = `${dayBookings.length} Buchung${dayBookings.length !== 1 ? 'en' : ''}`;
                    const pendingBadge = pendingCount > 0
                        ? `<span class="pending-badge">${pendingCount} offen</span>`
                        : '';
                    const dayRevenue = dayBookings.reduce((sum, booking) => {
                        return sum + Number.parseFloat(booking.price || 0);
                    }, 0);
                    const dayRevenueText = `Tagesumsatz: ${dayRevenue.toLocaleString('de-DE', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}€`;
                    const toggleText = isExpanded ? 'Weniger' : 'Öffnen';

                    html += `
                        <section class="day-group">
                            <button type="button" class="day-header ${isToday ? 'today' : ''}" onclick="${toggleAction}">
                                <div>
                                    <h3>${dateKey}</h3>
                                </div>
                                <div class="day-meta">
                                    <span class="count">${countText}</span>
                                    <span class="day-revenue">${dayRevenueText}</span>
                                    ${pendingBadge}
                                    <span class="day-toggle">${toggleText}</span>
                                </div>
                            </button>
                            <div class="day-bookings ${isExpanded ? 'expanded' : ''}" id="${dayId}">
                                ${dayBookings.map(booking => renderBookingSafely(booking)).join('')}
                            </div>
                        </section>
                    `;
                });

                document.getElementById('bookingsList').innerHTML = html;

                if (hasLikelyNewBooking && !forceUpdate) {
                    showNewBookingNotification();
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('bookingsList').innerHTML = `
                    <div class="empty-state">
                        <strong>Fehler beim Laden der Buchungen.</strong>
                        Bitte Seite neu laden oder später erneut versuchen.
                    </div>
                `;
            }
        }

        function showNewBookingNotification() {
            let notification = document.getElementById('newBookingNotification');
            if (!notification) {
                notification = document.createElement('div');
                notification.id = 'newBookingNotification';
                notification.className = 'new-booking-notification';
                notification.textContent = 'Neue Buchung verfügbar. Zum Aktualisieren klicken.';
                notification.onclick = () => {
                    loadBookings(true);
                    notification.remove();
                };
                document.body.appendChild(notification);

                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 5000);
            }
        }

        function toggleDay(button, dateKey) {
            const dayBookings = document.getElementById(getDayElementId(dateKey));
            const isExpanded = dayBookings.classList.contains('expanded');

            if (isExpanded) {
                dayBookings.classList.remove('expanded');
                expandedDays = expandedDays.filter(d => d !== dateKey);
            } else {
                dayBookings.classList.add('expanded');
                if (!expandedDays.includes(dateKey)) {
                    expandedDays.push(dateKey);
                }
            }

            const toggleLabel = button?.querySelector('.day-toggle');
            if (toggleLabel) {
                toggleLabel.textContent = isExpanded ? 'Öffnen' : 'Weniger';
            }

            localStorage.setItem('adminExpandedDays', JSON.stringify(expandedDays));
        }

        function startPolling() {
            if (isPolling) return;
            isPolling = true;

            setInterval(async () => {
                if (!isAuthenticated) return;

                try {
                    const response = await adminFetch('/api/admin/bookings');
                    if (!response.ok) {
                        return;
                    }

                    const bookingsData = await readJson(response) || [];
                    const bookings = Array.isArray(bookingsData) ? bookingsData : [];
                    const currentCount = bookings.length;
                    const newestId = bookings.length > 0 ? bookings[0].id : null;

                    if (currentCount !== lastBookingCount || (newestId && newestId !== lastBookingId)) {
                        await loadBookings(false);
                        await loadStatistics(currentPeriod, false);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 10000);
        }

        function getBoardTypeLabel(boardType) {
            const labels = {
                lightweight: 'Leichtgewicht',
                allround: 'Allround Damen',
                super_allround: 'Super-Allround',
                bigboard: 'Bigboard',
                single: 'Singleboard',
                partner: 'Partnerboard'
            };

            return labels[boardType] || 'Board';
        }

        function getBookingBoardItems(booking) {
            if (Array.isArray(booking.boardItems) && booking.boardItems.length > 0) {
                const normalizedItems = booking.boardItems
                    .map(item => normalizeBookingBoardItem(item, booking))
                    .filter(Boolean);

                if (normalizedItems.length > 0) {
                    return normalizedItems;
                }
            }

            return [normalizeBookingBoardItem({}, booking)];
        }

        function normalizeBookingBoardItem(item = {}, booking = {}) {
            if (!item || typeof item !== 'object') {
                return null;
            }

            const boardType = item.boardType || item.board_type || booking.boardType || booking.board_type || 'allround';
            const quantity = toPositiveInteger(
                item.quantity || item.numberOfBoards || item.number_of_boards,
                toPositiveInteger(booking.numberOfBoards || booking.number_of_boards, 1)
            );
            const peoplePerBoard = toPositiveInteger(
                item.peoplePerBoard || item.people_per_board,
                toPositiveInteger(
                    booking.peoplePerBoard || booking.people_per_board,
                    boardType === 'partner' || boardType === 'bigboard' ? 2 : 1
                )
            );

            return { boardType, quantity, peoplePerBoard };
        }

        function formatBoardItems(booking) {
            return getBookingBoardItems(booking)
                .map(item => {
                    const quantity = toPositiveInteger(item.quantity || item.numberOfBoards, 1);
                    const peoplePerBoard = toPositiveInteger(item.peoplePerBoard, item.boardType === 'partner' ? 2 : 1);
                    return `${quantity}x ${getBoardTypeLabel(item.boardType)}, ${peoplePerBoard} Pers./Board`;
                })
                .join(' / ');
        }

        function renderBookingSafely(booking) {
            try {
                return renderBooking(booking);
            } catch (error) {
                console.error('Error rendering booking:', booking?.id, error);
                return renderBookingFallback(booking);
            }
        }

        function renderBookingFallback(booking = {}) {
            const bookingName = String(booking.name || 'Ohne Namen');
            const bookingId = String(booking.id || '');
            return `
                <article class="booking-card">
                    <div class="booking-header">
                        <div class="booking-main">
                            <div class="booking-topline">
                                <h3>${escapeHtml(bookingName)}</h3>
                                <span class="status-badge status-pending">Prüfen</span>
                            </div>
                            <p class="booking-schedule">${escapeHtml(formatBookingTime(booking.startTime))} - ${escapeHtml(formatBookingTime(booking.endTime))}</p>
                            <div class="booking-meta">
                                <span class="meta-pill">Buchung konnte nicht vollständig dargestellt werden</span>
                                <span class="meta-pill">${escapeHtml(formatCurrency(booking.price || 0))}</span>
                            </div>
                            <p class="booking-phone">ID ${escapeHtml(bookingId)}</p>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderBooking(booking) {
            const startTime = formatBookingTime(booking.startTime);
            const endTime = formatBookingTime(booking.endTime);
            const bookingId = String(booking.id ?? '');
            const bookingIdJs = toJsString(bookingId);
            const bookingName = String(booking.name || 'Ohne Namen');
            const bookingNameJs = toJsString(bookingName);
            const notesElementId = `notes-${bookingId}`;
            const verifyAction = escapeHtml(`verifyPayment(${bookingIdJs}, this)`);
            const saveNotesAction = escapeHtml(`saveNotes(${bookingIdJs}, this)`);
            const deleteAction = escapeHtml(`deleteBooking(${bookingIdJs}, ${bookingNameJs}, this)`);
            const boardLabel = formatBoardItems(booking);
            const price = formatCurrency(booking.price || 0);
            const notes = booking.notes || '';
            const paymentLabel = booking.paymentMethod === 'paypal' ? 'PayPal' : 'Barzahlung';

            let statusBadge = '<span class="status-badge status-confirmed">Bestätigt</span>';
            let verifyButton = '';

            if (booking.status === 'payment_pending' || booking.status === 'pending') {
                statusBadge = booking.paymentMethod === 'paypal'
                    ? '<span class="status-badge status-payment_pending">PayPal offen</span>'
                    : '<span class="status-badge status-pending">Barzahlung offen</span>';
                verifyButton = `<button class="btn btn-verify" onclick="${verifyAction}">Zahlung bestätigen</button>`;
            }

            const verifiedPill = booking.paymentVerified && booking.verifiedAt
                ? `<span class="meta-pill meta-pill-verified">Verifiziert ${escapeHtml(new Date(booking.verifiedAt).toLocaleString('de-DE'))}</span>`
                : '';

            return `
                <article class="booking-card">
                    <div class="booking-header">
                        <div class="booking-main">
                            <div class="booking-topline">
                                <h3>${escapeHtml(bookingName)}</h3>
                                ${statusBadge}
                            </div>
                            <p class="booking-schedule">${escapeHtml(startTime)} - ${escapeHtml(endTime)}</p>
                            <div class="booking-meta">
                                <span class="meta-pill">${escapeHtml(boardLabel)}</span>
                                <span class="meta-pill">${price}</span>
                                <span class="meta-pill">${paymentLabel}</span>
                                ${verifiedPill}
                            </div>
                            <p class="booking-phone">Telefon ${escapeHtml(booking.phone || '')}</p>
                        </div>
                        <div class="booking-actions">
                            ${verifyButton}
                            <button class="btn btn-delete" onclick="${deleteAction}">Eintrag löschen</button>
                        </div>
                    </div>
                    <div class="notes-section">
                        <label class="notes-label" for="${escapeHtml(notesElementId)}">Notizen</label>
                        <textarea id="${escapeHtml(notesElementId)}" placeholder="Interne Notiz hinzufügen...">${escapeHtml(notes)}</textarea>
                        <div class="notes-actions">
                            <button class="btn btn-secondary" onclick="${saveNotesAction}">Notizen speichern</button>
                        </div>
                        ${notes ? `<div class="notes-display"><strong>Aktuelle Notiz:</strong> ${escapeHtml(notes)}</div>` : ''}
                    </div>
                </article>
            `;
        }

        async function verifyPayment(bookingId, button) {
            const originalText = button?.textContent;

            if (button) {
                button.disabled = true;
                button.textContent = 'Bestätigt...';
            }

            try {
                const response = await adminFetch(`/api/bookings/${encodeURIComponent(bookingId)}/verify`, {
                    method: 'POST'
                });
                const data = await readJson(response);

                if (response.ok && data?.success) {
                    lastBookingId = null;
                    await loadBookings(true);
                    await loadStatistics(currentPeriod, false);
                    showAdminFeedback('Zahlung wurde bestätigt.', 'success');
                } else {
                    showAdminFeedback(data?.error || 'Fehler bei der Bestätigung.', 'error');
                }
            } catch (error) {
                console.error('Error verifying payment:', error);
                showAdminFeedback('Fehler bei der Bestätigung.', 'error');
            } finally {
                if (button && button.isConnected) {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }
        }

        async function saveNotes(bookingId, button) {
            const notes = document.getElementById(`notes-${bookingId}`).value;
            const originalText = button?.textContent;

            if (button) {
                button.disabled = true;
                button.textContent = 'Speichert...';
            }

            try {
                const response = await adminFetch(`/api/bookings/${encodeURIComponent(bookingId)}/notes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ notes })
                });
                const data = await readJson(response);

                if (response.ok && data?.success) {
                    await loadBookings(true);
                    showAdminFeedback('Notizen wurden gespeichert.', 'success');
                } else {
                    showAdminFeedback(data?.error || 'Fehler beim Speichern der Notizen.', 'error');
                }
            } catch (error) {
                console.error('Error saving notes:', error);
                showAdminFeedback('Fehler beim Speichern der Notizen.', 'error');
            } finally {
                if (button && button.isConnected) {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }
        }

        async function deleteBooking(bookingId, bookingName, button) {
            const shouldDelete = window.confirm(`Eintrag von ${bookingName} wirklich dauerhaft löschen?`);
            if (!shouldDelete) {
                return;
            }

            const originalText = button?.textContent;
            if (button) {
                button.disabled = true;
                button.textContent = 'Löscht...';
            }

            try {
                const response = await adminFetch(`/api/bookings/${encodeURIComponent(bookingId)}`, {
                    method: 'DELETE'
                });
                const data = await readJson(response);

                if (response.ok && data?.success) {
                    lastBookingId = null;
                    await loadBookings(true);
                    await loadStatistics(currentPeriod, false);
                    showAdminFeedback(`Eintrag von ${bookingName} wurde gelöscht.`, 'success');
                } else {
                    showAdminFeedback(data?.error || 'Fehler beim Löschen der Buchung.', 'error');
                }
            } catch (error) {
                console.error('Error deleting booking:', error);
                showAdminFeedback('Fehler beim Löschen der Buchung.', 'error');
            } finally {
                if (button && button.isConnected) {
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }
        }
    </script>
</body>
